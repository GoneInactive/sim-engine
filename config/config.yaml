# miniX config.
#
# Network settings live here so the same code runs unchanged from a laptop
# (127.0.0.1) to the Hetzner VM later — just edit `host` values (or override
# via the matching env vars below), never hardcode an address in code.
#
# Env var overrides (useful for docker-compose / prod) take precedence over
# the values in this file. See src/exchange/config.py for the full mapping.

exchange_name: "miniX"

network:
  # Bind address for each service. Use 0.0.0.0 to accept connections from
  # other machines (e.g. once this moves to the Hetzner VM); 127.0.0.1 keeps
  # it local-only, which is the right default while testing on a laptop.
  api:
    host: "0.0.0.0"
    port: 8000
  admin_api:
    host: "0.0.0.0"
    port: 8001
  website:
    host: "0.0.0.0"
    port: 8090

  # Public-facing base URL students/admin use to reach each service. Locally
  # this matches host:port above; once deployed, set this to the VM's real
  # IP or hostname (e.g. "http://<hetzner-ip>:8000") without touching code.
  # This has to be the real public IP, not 127.0.0.1 — the website page's
  # own JS embeds api_base_url and calls it directly from each student's
  # browser (not proxied through this server), so 127.0.0.1 there would
  # resolve to the student's own machine and every register/login/order
  # call would silently go nowhere.
  public:
    api_base_url: "http://178.105.55.5:8000"
    admin_api_base_url: "http://178.105.55.5:8001"
    website_base_url: "http://178.105.55.5:8090"

database:
  # Local default; override via DATABASE_URL env var for other deployments.
  # Port 5433, not Postgres's usual 5432 — that port on this box's own
  # Postgres container already belongs to a different, unrelated service.
  url: "postgresql+asyncpg://sim_engine:sim_engine@127.0.0.1:5433/sim_engine"

# Index price is fully synthetic (no external feed — Kraken's live feed
# proved too unreliable to depend on for a multi-day unattended run).
# See src/exchange/synthetic_feed.py: a GBM random walk per product, plus
# an autonomous task that fires random market events on its own timer, on
# top of whatever the admin triggers manually.
synthetic_feed:
  tick_interval_seconds: 1.0
  random_events_enabled: true
  # Average seconds between autonomous random events (Poisson arrivals),
  # across both products combined.
  random_event_mean_interval_seconds: 240

# Every position cap below (products/spread/options/futures) is now
# relative to an account's live balance rather than a fixed contract count:
# max_position = floor(cash * leverage / mark_price), where mark_price is
# the instrument's current contract-scaled index price. `default_leverage`
# applies to any instrument that doesn't set its own `leverage:` override.
risk:
  default_leverage: 5.0

products:
  BTC-MINI:
    underlying: "BTC/USD"
    contract_size: 0.001
    tick_size: 0.10
    # Underlying (pre contract-size-scaling) starting price and annualized
    # GBM volatility/drift driving the synthetic index (see synthetic_feed
    # above). ~$77.5k matches build-spec.md §2's documented reference price.
    starting_price: 77500.0
    annual_volatility: 0.55
    annual_drift: 0.0
  ETH-MINI:
    underlying: "ETH/USD"
    contract_size: 0.03
    tick_size: 0.10
    starting_price: 2430.0
    annual_volatility: 0.70
    annual_drift: 0.0

# BTC-ETH mini spread: a single synthetic tradeable instrument whose price
# is BTC-MINI's index price minus ETH-MINI's index price (both already
# contract-notional-scaled — same convention as the admin's BTC/ETH spread
# *event*). Admin can enable/disable at any time from the admin page; the
# order book always exists, but student orders are rejected while disabled
# and its bots go passive.
spread:
  enabled_default: false
  symbol: "BTC-ETH-MINI"
  btc_product: "BTC-MINI"
  eth_product: "ETH-MINI"
  contract_size: 1.0
  tick_size: 0.10

# 1-hour rolling futures + calendar spreads, one ladder per underlying.
# `num_live` contracts are always kept live per underlying, each expiring
# `window_seconds` apart (a rolling ladder, not a shared clock-aligned
# window like the options chain below) — when the front contract expires
# it's cash-settled at the underlying's index price and a new far contract
# is added to keep `num_live` live. Calendar spreads are auto-registered
# between each adjacent pair of live contracts (near - far, both already
# contract-scaled) and rebuilt whenever a chain rolls. Displayed together
# as the Inter-Spread matrix on the website.
futures:
  enabled_default: false
  underlyings: ["BTC-MINI", "ETH-MINI"]
  window_seconds: 3600
  num_live: 5
  tick_size: 0.10

# Rolling option chains. Each entry is an independent chain (own underlying,
# own window/strikes/vol), generated automatically every window_seconds
# while enabled, priced by a per-contract market-maker bot quoting around a
# Black-Scholes theo (see src/exchange/options.py), and cash-settled against
# the underlying's index price at expiry. Admin can enable/disable each
# chain independently; disabling stops new chains from being created but
# lets any in-flight chain settle normally rather than stranding positions.
#
# strike_increment is in the underlying's own *contract-scaled* index-price
# units (the same ~77.5 space BTC-MINI itself quotes in, i.e. real BTC/USD
# price * BTC-MINI's contract_size) — not raw underlying dollars.
options:
  btc:
    enabled_default: false
    underlying: "BTC-MINI"
    window_seconds: 600
    strikes_each_side: 5
    strike_increment: 1.0
    implied_volatility: 0.55
    # 1.0, not BTC-MINI's own 0.001: price_tick() already feeds a fully
    # contract-scaled Black-Scholes theo straight into on_raw_tick, which
    # itself multiplies by contract_size again — anything but 1.0 here
    # silently rescales every option's price a second time.
    contract_size: 1.0
    # A 15-minute option's extrinsic value is genuinely tiny in this
    # contract-scaled price space (BS time value ~$0.09 even ATM, per
    # build/verification notes) — a coarser tick would round most of the
    # chain's bid side down to zero and make it untradeable.
    tick_size: 0.01
  eth:
    enabled_default: false
    underlying: "ETH-MINI"
    window_seconds: 600
    strikes_each_side: 5
    strike_increment: 0.5
    implied_volatility: 0.70
    contract_size: 1.0
    tick_size: 0.01
  btc_eth_spread:
    # Options on the BTC-ETH-MINI cross-product spread itself (see `spread`
    # above) — same mechanics, underlying is the spread's own index price
    # (which can be negative, so strikes straddle 0 rather than being
    # ATM-anchored to a positive spot).
    enabled_default: false
    underlying: "BTC-ETH-MINI"
    window_seconds: 900
    strikes_each_side: 5
    strike_increment: 1.0
    implied_volatility: 0.65
    contract_size: 1.0
    tick_size: 0.01

# Simplified market-maker bots: one bot per product/contract. `legs` bid/ask
# pairs are quoted per side, leg i sitting min_spread_ticks + i*delta_ticks
# ticks away from mid on each side (e.g. min_spread_ticks=2, delta_ticks=1,
# legs=4 -> legs at 2,3,4,5 ticks from mid, i.e. 4,6,8,10-tick bid/ask
# spreads). `default` applies to every base product plus the BTC-ETH spread;
# `options`/`futures` apply to every contract/calendar-spread spawned by
# those chains.
mm_bots:
  default:
    legs: 3
    min_spread_ticks: 2
    delta_ticks: 1.5
    quote_size: 3
    skew_sensitivity: 0.05
    requote_interval: 1.5
  options:
    legs: 2
    min_spread_ticks: 2
    delta_ticks: 2
    quote_size: 3
    skew_sensitivity: 0.05
    requote_interval: 1.5
  futures:
    legs: 3
    min_spread_ticks: 2
    delta_ticks: 1.5
    quote_size: 3
    skew_sensitivity: 0.05
    requote_interval: 1.5

# Noise-trader bots spawned alongside each options contract / futures
# contract / calendar spread as it's created — same NoiseBot as the base
# products (random side, random size, crosses the touch), just not wired
# through mm_bots' legs/spread knobs since noise bots don't quote. `count`
# noise bots are spawned per instrument, each at arrival_rate_per_sec +
# 0.1*i (matching BotManager.spawn_defaults' stagger for the base
# products) so they don't all fire in lockstep.
noise_bots:
  options:
    count: 2
    arrival_rate_per_sec: 0.2
    max_size: 2
  futures:
    count: 2
    arrival_rate_per_sec: 0.2
    max_size: 2

# "Insider" bots — a teaching/surveillance exercise, not a real strategy:
# each gets advance knowledge of the next scheduled random market event
# (see synthetic_feed.RandomEventScheduler.peek_next_event) and trades
# directionally `lead_seconds` before it fires, unwinding shortly after.
# Off by default; when enabled, these accounts are ordinary (not exempt
# from position limits) so their conspicuously well-timed P&L is something
# students can practice spotting on the leaderboard/fills, not a bot that
# quietly breaks the risk model.
insider_bots:
  enabled_default: false
  count: 2
  lead_seconds: 5.0
  size: 5
  hold_after_seconds: 8.0

accounts:
  starting_cash: 1000.0
  enforce_buying_power: false
  freeze_on_zero_equity: false

feed:
  stale_threshold_seconds: 7
  sma_window: 20
  reconnect_blend_seconds: 7
  shock_decay_seconds: 7

rate_limit:
  requests_per_second: 100
  burst: 400
  ws_connections_per_key: 10

fees:
  # Applied to every fill's notional (price * qty), on both sides. Negative
  # maker_bps is a rebate (maker gets paid to add liquidity); positive
  # taker_bps is a cost (taker pays to take liquidity).
  maker_bps: -2.0
  taker_bps: 2.0

admin:
  # Local dev default only — override via ADMIN_PASSWORD env var for any
  # non-local deployment. Never commit a real password here.
  password: "dev"

website:
  password: "dev"
